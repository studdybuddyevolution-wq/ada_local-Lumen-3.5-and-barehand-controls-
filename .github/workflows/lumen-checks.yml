name: Lumen focused checks

on:
  push:
    branches:
      - feature/lumen-manual-voice-engine-switch
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependency
        run: python -m pip install requests
      - name: Compile Python files
        run: python -m compileall -q core gui actions tests
      - name: Test engine-switch phrase parsing
        run: python -m unittest discover -s tests -p "test_engine_switch.py" -v
      - name: Test Barehands path safety
        run: python -m unittest discover -s tests -p "test_barehands.py" -v
